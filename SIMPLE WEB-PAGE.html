<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        p::first-letter{
            color: red;
            font-size: 25px;
        }

        h3 + h3{
            color: green;

        }

        ul li :first-child a{
            color: red;
        }

        a:link{
            color: blue;
        }
        a:visited{
            color: purple;
        }
        a:hover{
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <section>
        <h2>my section</h2>
        <p>This is the first paragraph. it has some sample text.</p>
        <p>This is the second paragraph. it also has sample text.</p>

    </section>
    <div>
        <h3>Heading one </h3>
        <h3>Heading two</h3>
    </div>

    <div>
        <ul>
            <li><a href="#">first link</a></li>
            <li><a href="#">second link</a></li>
            <li><a href="#">third link</a></li>
        </ul>
    </div>
</body>
</html>
