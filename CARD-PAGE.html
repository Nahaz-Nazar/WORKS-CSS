<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product card</title>
    <style>

        .product-card{
            width: 300px;
            height: 400px;
            
            border: 2px solid #ddd;
            border-radius: 12px;

            margin: 20px auto;



            padding: 15px;
            font-family: sans-serif;
            box-shadow: 0 4px 8px rgb(0, 0, 0, 0.1);
            overflow: hidden;

            
        }

         .product-image{
            max-width: 100px;
            min-width: 200px;
            height: 200px;

            object-fit: cover;
            border-radius: 8px;
            display: block;
            margin: 0 auto 15px auto;
         }

         .product-discription{
            font-size: 0.9rem;
            color: #666;
            line-height: 1.4;
         }
             


    </style>
</head>
<body>
    <div class="product-card">
        <img src="LEATHER BOOTS.png" alt="product-image" class="product-image">
        <h2 class="product-name">classic leather boots </h2>
        <p class="product-discription">
               women's leather boots are durable, versatile footwear crafted from animalhides.
        </p>
    </div>
</body>
</html>
