<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company contact</title>
    <style>
        body{
            margin: 0;
            font-family: Arial, sans-serif;
            min-height: 1500px;
        }

        .header{
            position: fixed;
            top: 0;
            width: 100%;
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 15px;
            font-size: 24px;
            z-index: 1000;

        }

        .profile-box{
            position: relative;
            width: 800px;
            margin: 100px auto;
            padding: 20px;
            border: 2px solid #ccc;
            background-color: #f4f4f4;
            overflow: auto;
            height: 250px;

        }
        .profile-box img{
            float: left;
            width: 150px;
            height: 150px;
            margin-right: 20px; 
        }

        .details{
            text-align: center;
            margin-left: 220px;

        }

        .contact-info{
            position: absolute;
            top: 20px;
            right: 20px;
            width: 180px;
            text-align: center;
            border-left: 3px solid black;/*vertical line*/
            padding-left: 15px;

        }
        h2, h3, p{
            text-align: center;
        }
        .clear{
            clear: both;
        }
        
    </style>
</head>
<body>
    <div class="header">
        Company contact card
    </div>

    <div class="profile-box>"></div>
    
    <img src="contact.png" alt="Profile Image">

    <div class="details">
        <h2>john smith</h2>
        <h3>software engineer</h3>
        <p>
            john is an experienced software engineer specializing
            in  web development and cloud technologies. he works on creating efficiant
            and user-friendly applications.
        </p>
    </div>
    
    <div class="contact-info">
        <h3>contact info</h3>
        <p>+91 9898765432 </p>
        <p>john@company.com</p>
    </div>
    <div class="clear"></div>



<div style="height: 100px;"></div>


</body>
</html>
